[package]
name = "tree-sitter-razor"
description = "Razor grammar for tree-sitter"
version = "0.1.0"
edition = "2021"
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "razor"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/your/tree-sitter-razor"

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "src/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.0"
tree-sitter-cli = "0.22"

[dev-dependencies]
tree-sitter = "0.22"
